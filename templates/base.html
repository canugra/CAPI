<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickmeal CAPI Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            navy: '#0D1B2A',
                            light: '#F2F4F7',
                            green: '#4CAF50'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Simple icon library via CDN (Feather icons) -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-brand-light min-h-screen text-gray-800 font-sans flex">

    {% if session.get('logged_in') %}
    <!-- Sidebar -->
    <aside class="w-64 bg-brand-navy text-white min-h-screen flex flex-col fixed inset-y-0 left-0 z-10">
        <!-- Logo -->
        <div class="p-6">
            <h1 class="text-2xl font-bold text-white tracking-tight">Quickmeal<span class="text-brand-green">.</span></h1>
            <p class="text-xs text-gray-400 mt-1">Real Food Made Easy</p>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="{{ url_for('dashboard') }}" class="flex items-center space-x-3 px-4 py-3 rounded-lg {% if request.endpoint == 'dashboard' %}bg-brand-green text-white font-semibold{% else %}text-gray-300 hover:bg-gray-800 hover:text-white transition-colors{% endif %}">
                <i data-feather="home" class="w-5 h-5"></i>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('leads') }}" class="flex items-center space-x-3 px-4 py-3 rounded-lg {% if request.endpoint == 'leads' %}bg-brand-green text-white font-semibold{% else %}text-gray-300 hover:bg-gray-800 hover:text-white transition-colors{% endif %}">
                <i data-feather="users" class="w-5 h-5"></i>
                <span>Leads</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                <i data-feather="shopping-cart" class="w-5 h-5"></i>
                <span>Orders</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                <i data-feather="server" class="w-5 h-5"></i>
                <span>CAPI Logs</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                <i data-feather="bar-chart-2" class="w-5 h-5"></i>
                <span>Analytics</span>
            </a>
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                <i data-feather="settings" class="w-5 h-5"></i>
                <span>Settings</span>
            </a>
        </nav>

        <!-- Bottom Actions -->
        <div class="p-4 mb-4">
            <div class="bg-gray-800/50 rounded-lg p-4 flex items-center space-x-3 cursor-pointer hover:bg-gray-700 transition-colors">
                <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center text-brand-green">
                    <i data-feather="message-circle" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-sm text-gray-300">Need help?</p>
                    <p class="text-sm font-medium text-white">Contact Support</p>
                </div>
            </div>
            
            <div class="mt-6 flex items-center space-x-3 px-2">
                <div class="w-8 h-8 rounded-full bg-white text-brand-navy flex items-center justify-center font-bold text-sm">
                    Q
                </div>
                <div>
                    <p class="text-sm font-medium text-white">Quickmeal</p>
                    <p class="text-xs text-gray-400">v1.0.0</p>
                </div>
            </div>
        </div>
    </aside>
    {% endif %}

    <!-- Main Content -->
    <div class="{% if session.get('logged_in') %}ml-64{% endif %} flex-1 min-w-0 flex flex-col min-h-screen bg-brand-light p-6 md:p-8">
        <div class="w-full">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        // Initialize Feather icons
        feather.replace();
    </script>
</body>
</html>
