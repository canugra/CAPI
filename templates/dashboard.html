{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6">Overview</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
    <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-500">
        <h3 class="text-gray-500 text-sm font-semibold uppercase">Total Leads</h3>
        <p class="text-3xl font-bold">{{ total_leads }}</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-green-500">
        <h3 class="text-gray-500 text-sm font-semibold uppercase">Paid Orders</h3>
        <p class="text-3xl font-bold">{{ total_orders }}</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-purple-500">
        <h3 class="text-gray-500 text-sm font-semibold uppercase">CAPI Success</h3>
        <p class="text-3xl font-bold">0</p>
    </div>
    <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-red-500">
        <h3 class="text-gray-500 text-sm font-semibold uppercase">CAPI Failed</h3>
        <p class="text-3xl font-bold">0</p>
    </div>
</div>

<div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Recent Leads</h3>
        <a href="{{ url_for('leads') }}" class="text-blue-500 hover:underline text-sm">View All Leads &rarr;</a>
    </div>
    <p class="text-gray-500 text-sm">No recent leads found.</p>
</div>
{% endblock %}
